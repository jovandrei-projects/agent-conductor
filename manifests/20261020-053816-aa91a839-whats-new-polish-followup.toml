[run]
merge = "auto"
parallel = false
merge_resolver = true
summarize = true
name = "whats-new-polish-followup"
description = "Run the integrated verification the whats-new-polish run never reached - all five feature branches are merged on main now - and finish the stale task-17 bookkeeping."
on_failure = "continue"
checkpoint = true

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 45
max_attempts = 2
# The registered gate (python run_tests.py --jobs 8, ~8-14 min wall) applies
# to this step automatically; verify_timeout_min must clear it or the step
# burns exactly like the original run did (AGENTS.md trap 18). One step on
# an idle box has no sibling load, but keep the 30-min cap anyway.
verify_timeout_min = 30

[[step]]
worktree = true
name = "integrated-validation"
project = "agent-conductor"
timeout_min = 45
prompt = '''
