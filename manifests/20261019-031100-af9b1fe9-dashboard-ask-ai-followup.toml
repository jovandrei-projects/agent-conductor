# Follow-up proposal drafted by the dashboard-ask-ai run's closing
# follow-up-plan step (run dir: data/runs/20261017-051357-dashboard-ask-ai,
# request 20261017-034530-cd55f6cc). Reviewed but NOT launched - a human
# reviews this file, then `python conductor.py run` or dashboard Start run.
#
# Reviewed evidence: the run's state.json + events.jsonl, every step's
# stdout/verify log tail, per-step STATUS/NEXT/OUTCOME lines, the
# .agent_tasks/ask-ai/{STATE,DESIGN}.md carried on the parked branches, the
# original request record 20261017-034530-cd55f6cc.json, and git topology
# (merge-base ef0179a, master 5b2be7b at review time).
#
# What the run actually did: ALL NINE feature steps completed real,
# verified work - but every one is recorded `failed`. Root cause is the
# post-step verify gate, not the work: `python run_tests.py --jobs 8` hit
# the hard-coded 600s cap on every step (the suite was ~890s unsharded /
# ~330s worst shard). The driving conductor started 05:13 and predates the
# verify_timeout_min key, which only reached master mid-run at 12:59
# (01d9ad7; the sharded gate itself is 31c8272) - so the manifest's own
# verify_timeout_min = 30 was dead config for this driver. Every branch was
# parked via step_merge_kept; NOTHING landed on master.
#
# The workers chained their work anyway: each step merged its predecessors'
# parked branches forward, so the integration-and-design-review tip e102e30
# holds the ENTIRE assembled feature - assistant/ stdlib-only package,
# assistant_host/ conductor adapters, chat UI (chat.js/md.js/chat.css),
# guarded-action adapter, usage/price accounting, ~200 new tests (734 total
# in-branch, green), 46 deterministic browser checks, and two live provider
# exchanges (~$0.034) with working citations and correct answers.
# research-and-design (e8c61bb) is the only tip NOT an ancestor of e102e30 -
# its .agent_tasks/ask-ai docs were carried forward by file copy - so it
# still needs its own merge. Three steps also exited without a STATUS line
# (persistent-chat-interface, guarded-dashboard-actions,
# usage-and-price-visibility); their commits are in the chain.
#
# What remains (the only scope below):
#   1. Land the nine parked branches - the work is done and verified;
#      missing are the merges, the state.json merge bookkeeping, and one
#      combined verification on a master that moved ~12 commits meanwhile
#      (parallel agent-slot pool + merge queue, sharded + configurable
#      verify gate, themed dialogs/power/busy-feedback, legacy-elapsed
#      rebuild, planner fix, this run's own manifest edit).
#   2. Post-merge verification of the landed feature - every prior check
#      ran on the pre-merge chain tip; the merged combination was never
#      exercised.
#   3. Honestly-unverified surfaces that only need a cheap live pass: a
#      real attachment-on-send vision turn, and a guarded-action
#      round-trip (propose -> confirm -> execute -> read-only denial) on
#      isolated fixture data.
#
# Deliberately excluded:
#   - The 600s verify-cap defect itself: FIXED on master (31c8272 sharded
#     the registered gate, 01d9ad7 made the cap configurable). This manifest
#     therefore uses the REAL gate with verify_timeout_min = 20 instead of
#     the verify="" workaround older follow-up manifests needed - any driver
#     launched now reads the fixed code. If the running conductor still
#     predates 01d9ad7 (check `git merge-base --is-ancestor 01d9ad7 HEAD`),
#     the gate stays at 600s and verify-dependent steps will false-fail
#     again - in that case stop and re-propose rather than burning a run.
#   - True token streaming via `devin acp`: blocked upstream (devin 3000.6.2
#     session-db missing migration V17__subagent_heads). `devin -p -r` is
#     the shipped transport and satisfies the request; re-check ACP only
#     after a devin CLI upgrade - an informational item, not a step.
#   - Real microphone transcription + OS-clipboard image paste: verified
#     down to the feature-detect/synthetic-event boundary; the last inch
#     needs a physical mic + headed browser - a human check, recorded in
#     .agent_tasks/ask-ai/STATE.md, not an unattended step.
#   - Phone access to the assistant: the dashboard is loopback-only by
#     design (documented scope boundary).
#
# Reviewer note on mixed isolation: step 1 deliberately runs in the MAIN
# checkout (it merges branches into the checked-out master - checkout-level
# work, established convention); the rest are worktree-isolated. The
# request form's worktrees checkbox cannot express that mix - launch via
# `python conductor.py run` on this file (or its owned copy) after review;
# the dashboard Start gate is designed to refuse exactly this state. KNOWN
# TRAP from run 20261016-013711-proposal-flow-fixes: this file is
# intentionally left UNTRACKED in manifests/ - if a merging branch also
# carries a same-path copy, git reports a false conflict; verify
# byte-identity before deleting either.
#
#   python conductor.py plan manifests\dashboard-ask-ai-followup.toml
#   python conductor.py run  manifests\dashboard-ask-ai-followup.toml

[run]
name = "dashboard-ask-ai-followup"
description = "Land the nine parked dashboard-ask-ai branches (the complete Ask-AI assistant: persistent chat core, view context + retrieval, runtime, UI, images/dictation, guarded actions, usage/price), then post-merge-verify the merged tree incl. a live attachment-vision turn and a guarded-action round-trip o..."
on_failure = "continue"
checkpoint = true
merge_resolver = true

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 60
max_attempts = 3
verify = "python run_tests.py --jobs 8"
# The registered gate is sharded now (worst shard ~330s before this run's
# ~200 tests joined - allow ~15 min) and verify_timeout_min is honored by
# any driver running code >= 01d9ad7. 20 min leaves real headroom.
verify_timeout_min = 20

# ---------------------------------------------------------------------------
# Step 1 runs in the MAIN checkout on purpose: merging parked branches into
# the checked-out master is checkout-level work (established convention).
[[step]]
name = "land-parked-ask-ai"
project = "agent-conductor"
timeout_min = 120
prompt = '''
Land the nine parked worktree branches of run 20261017-051357-dashboard-ask-ai onto master in THIS (main) checkout. All feature work on them is complete and was verified by the workers in-worktree - your job is the merges, the run-record bookkeeping, and the combined verification, not re-doing features.

Parked state (confirm with `git branch --list "conductor/20261017-051357-dashboard-ask-ai/*"` and `git worktree list`):
- research-and-design tip e8c61bb - docs only: .agent_tasks/ask-ai/{STATE,DESIGN}.md + QUEUE/efficiency rows; NOT an ancestor of the chain tip.
- persistent-chat-core eb5a06a, view-context-and-retrieval 7c03230, assistant-runtime ee518a1, persistent-chat-interface 929bff0, images-and-dictation f9d203b, guarded-dashboard-actions 80725fe, usage-and-price-visibility 7c1efb7 - chained: each is an ancestor of the next.
- integration-and-design-review tip e102e30 - cumulative tip containing ALL of the above (workers merged predecessors forward). Merging e8c61bb + e102e30 lands everything.

Preflight - do NOT skip:
- Confirm the parent run ended: data/runs/20261017-051357-dashboard-ask-ai/state.json has no step still `running` and its driver_pid is dead (the merge verb refuses while it executes anyway).
- Check every OTHER data/runs/*/state.json: if any has a live driver_pid or a step whose work_dir is inside this repo, finish `blocked` and name it - a foreign driver's `git add -A` checkpoint can sweep your mid-merge tree into a stray "checkpoint" commit (documented incident), and a same-repo merge lock may already be held.
- Checkout must be on master with no staged or tracked-modified files. Untracked manifests/*-followup*.toml intake files are EXPECTED - leave them alone (git status is "clean enough" with them present; do not delete or commit them yourself). manifests/dashboard-ask-ai-followup.toml itself exists untracked here - git treats an untracked same-path file as a merge conflict, so verify byte-identity before touching it.

Then:
1. Run `python conductor.py merge 20261017-051357-dashboard-ask-ai` (bare run-dir NAME - a path fails RUN_DIR_RE validation) - the supported pending-branch path merges all nine in manifest order and stamps merged/merged_at + step_merged events (flipping the failed statuses off). The run had merge_resolver = true, so conflicts may spawn resolve-* sessions in the merge location - let them finish rather than racing them.
2. For any branch left conflicted, merge by hand in manifest order: `git merge --no-edit conductor/20261017-051357-dashboard-ask-ai/<step>`; the equivalent shortcut is merging e8c61bb then e102e30 (the second carries the other seven), then re-running the merge verb so it observes now-merged branches and stamps the remaining records (an already-ancestor branch is a no-op merge - fine). Expected conflicts: .agent_tasks/QUEUE.md + .agent_tasks/efficiency_stats.md (both-append bookkeeping - union them, keep every line from both sides) and REAL semantic overlaps: master gained the parallel agent-slot pool + merge queue (25374a1), the sharded verify gate (31c8272), configurable verify timeout (01d9ad7), themed askConfirm/askAlert + power dialog + busy feedback (a0a16a9, 27e901f, 1020853, 6e02665, fe1bd0b), legacy-elapsed rebuild + trash unstick (49010bd) and a planner fix (7915ace) after the chain's merge-base ef0179a - the merged tree must keep BOTH sides' features; never resolve by dropping a side. The branches also touch conductor.py, tests/test_conductor.py, tests/test_worktrees.py, projects.toml, AGENTS.md, ROADMAP.md. Afterwards `git grep -n "^<<<<<<<"` must be empty.
3. Verify: `git merge-base --is-ancestor e8c61bb master` AND `git merge-base --is-ancestor e102e30 master` succeed (the second covers the seven chained steps); state.json shows all nine records merged=true; `git worktree list` shows none of the run's worktrees left (remove any survivors once their branch is provably merged); `python run_tests.py --jobs 8` run BY YOU to green (~15 min on the combined tree - do not trust the old 600s figure); `python conductor.py demo` green.
4. If the combined tree genuinely fails, investigate and fix on master as separate commits - never finish with a merge in progress: each attempt ends committed or `git merge --abort`ed.

Update .agent_tasks (the merged branches carry most ledger entries - add what is missing, incl. a QUEUE.md line for this landing and ticking .agent_tasks/ask-ai/STATE.md) and commit bookkeeping separately from fixes.
'''

# ---------------------------------------------------------------------------
[[step]]
name = "post-merge-assistant-verification"
project = "agent-conductor"
worktree = true
timeout_min = 90
prompt = '''
The assembled dashboard Ask-AI assistant landed on master in the previous step after a whole run of parked-branch work. Prove it on the MERGED tree - every prior check ran on the pre-merge chain tip e102e30, and master moved ~12 commits during that run.

Read .agent_tasks/ask-ai/STATE.md + DESIGN.md first - they are the feature's contracts, verified-facts list, and honest-gap ledger. If step 1 did not land (check `git merge-base --is-ancestor e102e30 master` in your worktree's repo and .agent_tasks/ask-ai/ existing on master), finish `blocked` naming it - do not re-implement.

Setup (trap-5-safe, the pattern the integration step proved): serve the dashboard from YOUR worktree bound to the leased port only ($CONDUCTOR_SERVICE_URL / $CONDUCTOR_SERVICE_PORT - never :8773, never a listener you did not spawn) with an ISOLATED data dir - `python conductor.py serve --port <leased> --runs-dir <a %TEMP% dir>` whose records you seeded by COPYING the needed run/request entries out of the shared data/ tree. First confirm no run driver is live (data/runs/*/state.json driver_pid liveness) and never mutate the real records.

Verify, in order:
- `python -m unittest discover -s tests -p "test_assistant*.py"` for a fast signal, then the full `python run_tests.py --jobs 8` to green (you run it; size your patience to ~15 min, not the historical 600s cap).
- A deterministic browser pass over the merged UI - Playwright headless Chromium was used in-branch and is on this box; the node-vm harness is the fallback, say which you used. Cover: FAB open/minimize/reopen, compact/expanded modes, the `#dask` launcher inside a modal (it toggles), ctx chip following dashboard->modal->close, draft + last conversation surviving reload, settings dialog round-trip incl. the price-provenance line, attach->thumbnail->remove, dictation feature-detect states, history rail, per-exchange usage details + grand total, citation chips AND in-text nav: links opening the right modal without resetting chat. Commit the probe script under tests/ or a probes/ dir - past probes died in scratch dirs.
- Live provider micro-spend (devin is authenticated on this box; keep total under ~$0.10 and record actual spend): (a) ONE exchange with a real image attached - the attachment-on-send vision turn is the flagged-unverified surface; (b) one read-only question against a copied run record confirming citations still resolve post-merge; (c) one guarded-action round-trip on isolated fixture data - propose, confirm through the action card, watch it execute on the scratch record, then prove the same call is DENIED while read-only is on. Never act on real run/request records and never launch a real conductor run.
- Honestly mark what stays unverified unattended: real mic transcription and OS-level clipboard paste need a physical mic/headed browser - record them as human-check items in STATE.md, not as pass or fail.

Fix only small in-scope defects you actually find; anything structural goes in the report as a finding, and finish `partial` rather than patching if it blocks the feature. Kill EVERY spawned process (serve, browser drivers) BEFORE printing STATUS - a live child keeps this CLI session from exiting (trap 12). Update .agent_tasks/ask-ai/STATE.md (post-merge verification section + honest-gap ledger) and QUEUE.md; commit code separately from bookkeeping.
'''

# ---------------------------------------------------------------------------
[[step]]
name = "follow-up-plan"
project = "agent-conductor"
worktree = true
timeout_min = 25
# A manifest+docs step: gating it on the ~15-min suite buys no signal.
verify = ""
prompt = '''
Review what this follow-up run accomplished against the residuals it targeted: the nine parked dashboard-ask-ai branches landed on master (or not) with truthful state.json records, the post-merge verification results, and any defects the live pass surfaced.

Per-step logs, STATUS/NEXT/OUTCOME lines and notes are under C:/Projects/agent-conductor/data/runs in the newest dir ending in 'dashboard-ask-ai-followup', alongside .agent_tasks/ask-ai/ (now on master) and the merged git state. Check the sibling proposals that were still unlaunched at draft time (manifests/*-followup.toml: ux-controls, proposal-ui-fixes, proposal-flow-fixes, run-review-ux, model-compare-mobile, workflow-ux-safety, apartment-play-edit) so overlapping items are never proposed twice - and note whether any were launched meanwhile.

Then write a NEW conductor TOML manifest proposing only the still-unfinished or newly discovered work, saved as 'C:/Projects/agent-conductor/manifests/dashboard-ask-ai-followup-2.toml' using forward slashes, and register it via `python conductor.py import manifests/dashboard-ask-ai-followup-2.toml --run <this run's dir>` (explicit import is the supported flow - the -2 name is outside the *-followup.toml discovery glob by design). Follow this manifest's conventions: registered project slugs, worktree = true for code steps, the registered verification command in [defaults] with verify_timeout_min sized for the suite, max_attempts = 3, merge_resolver = true, a closing follow-up-plan step. Do NOT launch or implement the follow-up - a human reviews it. If nothing remains, say so explicitly in the manifest header comment without inventing work.
'''
