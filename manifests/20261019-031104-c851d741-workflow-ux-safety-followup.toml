[run]
name = "workflow-ux-safety-followup"
description = "Land the three parked workflow-ux-safety branches (service-port leases, merge_target, deferred-merge controls), make step checkpoints merge-aware, harden mobile post-tap verify + opt mobile projects into device leases, live-smoke the landed set."
on_failure = "continue"
checkpoint = true
merge_resolver = true

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 60
max_attempts = 3
verify = "python run_tests.py"

# Every step sets verify = "" on purpose: the driving conductor's post-step
# gate is hard-capped at 600s (run_step's timeout=600; the deferred-staging
# verify likewise) while this suite already needs ~580s BEFORE the ~46
# parked-branch tests land. Each prompt requires running `python
# run_tests.py` manually to green - same gate, uncapped. The configurable
# timeout is owned by run-review-ux-followup.toml's verify-timeout-config.

# ---------------------------------------------------------------------------
# Step 1 runs in the MAIN checkout on purpose: merging parked branches into
# the checked-out master is checkout-level work (established convention).
[[step]]
name = "land-parked-branches"
project = "agent-conductor"
timeout_min = 120
verify = ""
prompt = '''
Land the three parked worktree branches of run 20261016-013719-workflow-ux-safety onto master in THIS (main) checkout. All feature work on them is complete and was verified by the workers in-worktree - your job is the merges, the run-record bookkeeping, and the combined verification, not re-doing features.

Parked state (confirm with `git branch --list "conductor/20261016-013719-workflow-ux-safety/*"` and `git worktree list`):
- isolate-worktree-services tip f071b48 - worker port leases (8806-8859) + CONDUCTOR_* env + leased serve port; in-worktree 241/241 green.
- project-merge-targets tip 00ec1fd - merge_target end-to-end; removes worktree_merge in favor of merge_step_branch and rewires _merge_run; in-worktree 247/247.
- deferred-merge-controls tip 32b44b7 (base a649a85) - merge-timing option + pending-merge panel; in-worktree 258/258.

Preflight - do NOT skip:
- Confirm the parent run ended: data/runs/20261016-013719-workflow-ux-safety/state.json has no step still `running` and its driver_pid is dead.
- Check every OTHER data/runs/*/state.json: if any has a live driver_pid or a step whose work_dir is inside this repo, finish `blocked` and name it - a foreign driver's `git add -A` checkpoint can sweep your mid-merge tree into a stray "checkpoint" commit (documented incident from this very run), and a same-repo merge lock may already be held.
- Checkout must be on master with no staged or tracked-modified files. Untracked manifests/*-followup*.toml intake files are EXPECTED - leave them alone (git status is "clean enough" with them present; do not delete or commit them yourself).

Then:
1. Run `python conductor.py merge 20261016-013719-workflow-ux-safety` (bare run-dir NAME - a path fails RUN_DIR_RE validation) first - the supported pending-branch path merges in manifest order and stamps merged/merged_at + step_merged events (flipping the failed statuses off). The run had merge_resolver = true, so conflicts may spawn resolve-* sessions - let them work.
2. For any branch left conflicted, merge by hand: `git merge --no-edit conductor/20261016-013719-workflow-ux-safety/<step>` in manifest order (isolate-worktree-services, then project-merge-targets, then deferred-merge-controls). Expected conflicts: .agent_tasks/QUEUE.md + .agent_tasks/efficiency_stats.md (both-append bookkeeping - union them, keep every line from both sides, chronological order) and REAL semantic overlaps in conductor.py + tests: project-merge-targets replaced worktree_merge with merge_step_branch/_merge_loc/merge_wt_for and rewired _merge_run, while master gained deferred-merge-engine's pending_merges loop + _RepoMergeLock + _merge_deferred_group staging AFTER that branch forked - the merged _merge_run must keep BOTH: recorded-target-aware legacy merges AND the serialized deferred pipeline. Likewise deferred-merge-controls' collect_dashboard/JS hunks sit next to later master work (followup stamps, watcher identity, service rows) - keep both sides' features. Never resolve by dropping a side. Afterwards `git grep -n "^<<<<<<<"` must be empty.
3. Re-run the merge verb so it observes now-up-to-date branches and stamps the remaining records (`merged`/`merged_at`/status flip + step_merged events). If a branch already landed it is a no-op merge - that is fine.
4. Verify: `git merge-base --is-ancestor <tip> master` succeeds for all three; state.json shows the three records merged=true; `git worktree list` shows none of the run's worktrees left (remove any survivors once their branch is provably merged); `python run_tests.py` run BY YOU to green (expect ~700s+ once the ~46 parked tests join - the driving gate's 600s cap is a KNOWN false-fail, that fix lives in the sibling run-review-ux-followup manifest); `python conductor.py demo` green.
5. If the combined tree genuinely fails, investigate and fix on master as separate commits - never finish with a merge in progress: each attempt ends committed or `git merge --abort`ed.

Update .agent_tasks (the merged branches carry most ledger entries - add what is missing, incl. a QUEUE.md line for this landing) and commit bookkeeping separately from fixes.
'''

# ---------------------------------------------------------------------------
[[step]]
name = "merge-aware-checkpoints"
project = "agent-conductor"
worktree = true
timeout_min = 75
verify = ""
prompt = '''
This run produced a documented incident: a foreign driver's post-step checkpoint ran `git add -A && git commit` in a checkout that had a merge in progress, sweeping the mid-merge tree into a stray "conductor: checkpoint" commit (see QUEUE.md's isolate-proposal-planning UPDATE). deferred-merge-engine added _RepoMergeLock for merge-vs-merge, but the checkpoint side is still open: git_commit (conductor.py ~line 1000) is a bare add-A+commit with no merge awareness, reached from the pre-step checkpoint (~3534), the post-attempt commit (~3733), and the wave checkpoint (~4278).

Make checkpoints merge-aware:
- A checkpoint landing where `merge_in_progress(work_dir)` or `_repo_merge_busy(work_dir)` must NOT `git add -A` - it would capture someone else's conflicted tree. Decide the right semantics per call site and document them: pre-step in such a checkout should probably fail the step with a clear note (committing there is corruption-prone anyway); post-step/wave sites should skip the commit and record why on the step record rather than silently absorbing a merge - but never leave the driver believing work was checkpointed when it was not.
- Keep the change small and consistent with existing helpers (merge_in_progress, _repo_merge_busy, git_dirty_tracked). A merge a HUMAN started is protected the same way - never abort, never adopt.
- Cover it with tests in the existing style (tempdir repos): pre-step checkpoint refuses on an open merge, post-step checkpoint skips with a recorded note, live foreign lock-file blocks, a dead holder's lock does not, and normal checkpoints still work.
- Check for other `git add -A`/`git_commit` callers that can hit a checkout with foreign merge state (resolve-* dispatch paths, resume, sweep-adjacent paths) and give them the same guard or document why they are safe.

Run `python run_tests.py` manually to green (~12+ min; the conductor gate cap is known-broken, see the header comment). Update .agent_tasks and commit code separately from bookkeeping.
'''

# ---------------------------------------------------------------------------
