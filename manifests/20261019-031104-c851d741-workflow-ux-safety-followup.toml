project = "agent-conductor"
worktree = true
timeout_min = 75
verify = ""
prompt = '''
Two leftovers from the mobile half of run 20261016-013719-workflow-ux-safety (see its state.json outcomes and QUEUE.md entries for emulator-resource-ownership, mobile-relaunch-handling, apartment-mobile-relaunch, integration-regressions):

1. mobile_device.py confirm-navigation: the post-tap cleared-verify can false-fail - the Leave/Stay tap lands and the dialog is gone (verified by screencap), but a slow or stale uiautomator dump during modal dismissal still produces rc=4 (observed live by the apartment-mobile-relaunch step; integration-regressions recorded the same as a documented limitation). Harden it: a bounded post-tap confirmation that tolerates transient dump failures - e.g. retry/backoff with a fresh dump required to prove the dialog is GONE, optionally cross-checked via `dumpsys window` focus/`mCurrentFocus` before declaring timeout. Keep every guarantee: never auto-accept, --leave/--stay consent unchanged, foreign/ unexpected dialogs still refuse with diagnostics, all waits stay bounded, the serial lease enforcement is untouched.
   Tests: extend the MobileDeviceTests family - stale/empty dump then cleared = success, persistent dialog = still rc=4-equivalent failure, foreign signature still refused, per-call timeouts still honored.

2. The device lease ships dark: no projects.toml entry carries `device`, so the machinery built this run is never exercised. Add `device = "emulator"` to the projects that demonstrably run Android work - apartment-3d (proven device harnesses + this run's live validation) and mobile-apps at minimum; check data/runs evidence for model-compare before deciding (the model-compare-mobile run name suggests device use - verify rather than assume). Comment the choice in projects.toml and make sure AGENTS.md's device paragraph already documents project-level inheritance (it should - verify the claim, fix if stale). Do NOT touch cloud_ok gates.

Run `python run_tests.py` manually to green. Update .agent_tasks; commit code separately from bookkeeping.
'''

