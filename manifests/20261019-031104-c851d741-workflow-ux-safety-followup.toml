project = "agent-conductor"
worktree = true
timeout_min = 90
verify = ""
prompt = '''
The three branches landed by step 1 (service-port leases, merge_target, deferred-merge controls) plus this run's follow-up registration are mock/e2e-verified but were never exercised live end-to-end. Do that pass now against the LANDED master state.

TRAP-5-safe setup (proven pattern): copy the repo to a scratch dir nobody watches - robocopy/xcopy C:\Projects\agent-conductor -> %TEMP%\ac-wfus-smoke-<ts> EXCLUDING .git, data, worktrees, caches; run `python examples/make_demo_projects.py` + `python examples/make_lab_projects.py` in the copy so data/demo*/lab-* exist; serve FROM THE COPY on a free 87xx port so every write lands in the copy's data/. First confirm no run driver is live in the real checkout (data/runs/*/state.json driver_pid liveness) - do not disturb a live run.

Exercise and report each item honestly (real Chromium via Playwright preferred; node-harness otherwise - say which):
- Service ports: a small 2-step manifest in the scratch copy with worktree steps shows each step leasing a distinct service_port/service_url on its agent row + task modal 'service' row, released at step end, no :8773 collision.
- merge_target: the request form's branch field lists real local branches for a selected project (GET /api/projects/<slug>/branches); a demo/lab project given a non-main branch receives a worktree step's merge on THAT branch, not the default - recorded target_branch visible in the run modal.
- Deferred merging: a scratch manifest with merge = "deferred" leaves branches pending after the wave; the run modal's Pending merges panel lists them grouped by project with verify chips; the confirmed Merge selected lands them, alternatives stay uncombined, and a busy/dirty stage keeps things pending with an honest state.
- Follow-up registration: a produced <scratchrun>-followup.toml in the copy's manifests/ becomes a Ready-to-run request row on refresh/restart (durable listing - the run that built this feature just had five registered follow-ups vanish from data/requests under unclear circumstances; prove the guarantee holds in the copy).

Verify, do not fix: record precisely what works live vs what is broken, in .agent_tasks; finish `partial` rather than patching here. COMMIT the probe script(s) under tests/ or a probes dir (past probes died in scratch/). Kill EVERY spawned process - serve, browser drivers, demo runs - BEFORE printing STATUS (trap 12). Commit bookkeeping only.
'''

