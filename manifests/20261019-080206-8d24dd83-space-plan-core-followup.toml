# Newly discovered regressions/prerequisites this manifest repairs:
#   R1 root cause - agent-conductor worktree teardown follows NTFS
#      junctions on Windows (git worktree remove --force / shutil.rmtree
#      paths; py3.11 islink does not detect junctions). It EMPTIED
#      apartment-3d's canonical assets at 04:20 during the
#      baseline-contracts post-merge teardown. Every future worktree that
#      runs link-assets.mjs exposes the store again.
#   R2 the emptied store itself - DECISIONS #96 "needs human restore".
#      Survivors must be preserved before Downloads gets cleaned, and the
#      restore/no-reshoot decision belongs to the human (phone queue).
#   R3 merge bookkeeping - DECISIONS numbering collides (branch 96-106 vs
