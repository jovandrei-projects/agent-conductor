#      A2-CLOSED-LOOP.md on that branch. PNG/report artifacts are
#      gitignored - they live only in the a2 worktree and must be copied
#      into the run artifacts dir before that worktree is ever cleaned.
#   4. docs/INTAKE.md - DELIVERED + MERGED. Phases A/B/C, evidence grades,
#      wizard routing incl. plan-less guess-map gate, guided capture
#      (N/S/E/W stills, orbit, scale anchor, follow-up questions),
#      verified agent-conductor-vs-in-app evaluation + recommendation,
#      explicit deferrals. Honest "failed this run" capability table.
#   Conditional second-plan exercise - NOT EXERCISED, honestly recorded.
#      Re-checked for this review: assets/floorplan/ holds only
#      a2-apt1617.png + two A2 derivatives (annotated-arrows.png,
#      minimap-flipped.png, sha256s logged by unseen-plan-check);
#      assets/floorplans/ does not exist. No second unit-type plan.
