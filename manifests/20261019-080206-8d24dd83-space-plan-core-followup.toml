# Follow-up proposal drafted by the space-plan-core run's closing
# follow-up-plan step (run dir: data/runs/20261019-035841-space-plan-core,
# request 20261019-034417-b712823e, source manifest
# manifests/20261019-034417-b712823e-space-plan-core.toml).
# Reviewed but NOT launched - a human decides whether to run it.
#
# Reviewed evidence: run state.json + events.jsonl, every step's
# stdout/verify logs + export, per-step .agent_tasks STATE.md in the
# surviving worktrees, the merged code on apartment-3d main (src/importer/,
# docs/INTAKE.md, tools/floorplan-import*.mjs present; src/worlds/,
# src/world.js, src/overlay/, tools/{pack-test,overlay-*} absent), git
# ancestry of the unmerged branches, a trial merge-tree (conflicts only in
