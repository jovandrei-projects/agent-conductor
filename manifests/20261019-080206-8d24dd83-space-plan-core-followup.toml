[run]
summarize = true
name = "space-plan-core-followup"
description = "Land the three verified-but-unmerged space-plan-core branches onto apartment-3d main, fix the junction-traversing worktree teardown that emptied its canonical asset store, and stage surviving assets for the human restore decision."
on_failure = "continue"
checkpoint = true
merge_resolver = true
parallel = false

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 60
max_attempts = 3

[[step]]
name = "junction-safe-teardown"
project = "agent-conductor"
worktree = true
merge_target = "master"
timeout_min = 60
verify = "python run_tests.py --jobs 8"
prompt = '''
Read AGENTS.md first. Fix a data-loss bug in conductor's worktree teardown, nothing else.

Background evidence (already verified - do not re-litigate): run 20261019-035841-space-plan-core. At ~04:20 on 2026-10-19 the post-merge teardown of the baseline-contracts worktree followed NTFS directory junctions inside the worktree and emptied the junction TARGETS - apartment-3d's canonical `assets/{videos,media,frames,extras,apartment-frames,textures/crops}` (those dirs junctioned to C:\Projects\apartment-3d\assets via that project's tools/link-assets.mjs, DECISIONS #91; the loss is recorded in apartment-3d DECISIONS #96 and the a2-closed-loop STATE.md). Teardown call sites to audit: worktree_remove (`git worktree remove --force`, ~L1408) which git-for-windows performs by recursively deleting the tree and follows junctions, plus every shutil.rmtree over a worktree dir (merge staging ~L11313, debris/trash paths). Python 3.11 `os.path.islink` does NOT detect junctions - detection needs `os.lstat` FILE_ATTRIBUTE_REPARSE_POINT (or equivalent stdlib on this box's Python).

Implement: before any conductor-owned recursive delete of a worktree directory, enumerate and unlink directory junctions/symlinks inside it (unlink the reparse point only - never traverse into the target), then proceed with the existing removal. Cover worktree_remove and the rmtree call sites that can see a worktree; leave trash/debris semantics, merge logic, leases, and everything else untouched. A junction whose target is already gone must still unlink cleanly.

Add a regression test in the existing tests/ conventions: build a scratch worktree-shaped dir containing a junction to a canary dir with sentinel files, run the conductor deletion path, assert the canary's contents survive and the junction itself is gone. No sleeps/timing games; stdlib only per house rules.

Run `python run_tests.py --jobs 8`. Commit in logical groups with why-messages. Local worker - no cloud, no pushing. Leave STATUS/NEXT per the worker contract.
'''

[[step]]
name = "land-space-plan-branches"
project = "apartment-3d"
worktree = true
merge_target = "main"
timeout_min = 90
depends_on = ["junction-safe-teardown"]
verify = "python run_tests.py"
prompt = '''
Read AGENTS.md, ROADMAP.md, docs/PIPELINE.md, docs/DECISIONS.md first, then the three surviving STATE.md files under data/worktrees/20261019-035841-space-plan-core/{world-pack,overlay-verifier,a2-closed-loop}/.agent_tasks/. Context: steps 32/34/35 of run 20261019-035841-space-plan-core were recorded `failed` ONLY because their STATUS lines were absent or malformed - all three steps produced verified, committed work on their branches. Branch `conductor/20261019-035841-space-plan-core/a2-closed-loop` already contains world-pack and overlay-verifier as ancestors (confirmed via git merge-base), so ONE merge lands all three deliverables.

Land it: in your worktree (branched from main), `git merge --no-edit conductor/20261019-035841-space-plan-core/a2-closed-loop`. A trial merge already showed code merges clean; conflicts are expected only in .agent_tasks/QUEUE.md, ROADMAP.md, docs/DECISIONS.md (SESSION_LOG.md auto-merges). Resolution rules:

- DECISIONS.md: keep main's #96 (asset store emptied) and #97 (intake home). Renumber the incoming branch's entries 96-106 to 98-108 and update every textual cross-reference (docs/importer/A2-CLOSED-LOOP.md cites "decisions 103-106" -> 105-108; the overlay STATE cites "96-102" -> 98-102; grep for other citations of those numbers before finishing).
- QUEUE.md rows 32/34/35 -> done, citing where the merged code/evidence lives. ROADMAP phase-8 boxes for world-pack/overlay-verifier/a2-closed-loop -> tick ONLY after the merged tree re-verifies below.
- Carry the three tasks' STATE.md folders into .agent_tasks/{world-pack,overlay-verifier,a2-closed-loop}/ from the sibling worktrees (those folders don't exist on main) and add a "landed on main" header line to each. Fix floorplan-importer STATE.md's stale "in-progress" header - its work is merged and verified.
- docs/SESSION_LOG.md: append a run-closing entry recording that the three `failed` records were report-contract artifacts, what the merge landed, and the merge sha.

Preserve the gitignored evidence BEFORE any worktree cleanup: copy the a2 worktree's final artifacts - shots/overlay-a2-iter13/ and shots/overlay-a2-iter13-noref/ (render+plan+overlay+mask PNGs, overlay-report.{json,md}), shots/a2/iter13*/ (doc, meta, import-debug), and the iteration dirs shots/overlay-a2-iter{5,9,10,10b}/ - into C:\Projects\agent-conductor\data\runs\20261019-035841-space-plan-core\artifacts\a2-proof\ (run dir is shared across worktrees and survives cleanup; artifacts stay untracked as required for personal-derived imagery).

Assets for the gates: do NOT create junctions into the canonical store - it is emptied per DECISIONS #96, and never write to C:\Projects\apartment-3d. Repopulate the 5 boot-fetched files as REAL copies inside your worktree: assets/media/{tv-golf,lap-city}.mp4 and assets/textures/crops/{mon-karaoke,mon-onepiece,skyline-canvas}.jpg from C:\Projects\apartment-3d\mobile\app\src\main\assets\assets\{media,textures\crops} (read-only source - the untouched mobile-bundle staging dir).

Verify the MERGED tree (npm ci first if node_modules is absent): npm run build; node tools/pack-test.mjs; node tools/overlay-test.mjs; node tools/floorplan-import-test.mjs; node tools/{state,store,variant,finish}-test.mjs; then npm run verify and python run_tests.py with APT3D_PORT set to your leased $CONDUCTOR_SERVICE_PORT. Everything green on the integrated result - investigate any regression as a real merge bug, never by weakening a test.

Record in the landing notes, verbatim-honest: the 11 doc-vs-oracle delta records are REPORTED deltas, not resolved ones; `?struct=imported` stays opt-in with the hand-built shell as default; promoting it requires per-element adjudication and is explicitly out of scope. Re-run the A2 gate once on the merged tree (commands in docs/importer/A2-CLOSED-LOOP.md: import -> overlay-verify --out shots/overlay-a2-postmerge-noref --port $PORT, and the --ref diff vs the frozen oracle doc in the run artifacts dir) and confirm it still reports PASS 0-fail vs the source plan and the same ~11-record delta list - investigate any drift rather than editing the oracle.

House rules: local only, loopback-only servers on the leased port, muted autoplay, no new editor/intake/tour features, assets stay gitignored. Commit in logical groups with why-messages. Update QUEUE/STATE so the next session resumes cleanly; leave STATUS/NEXT/OUTCOME as the last stdout lines.
'''

[[step]]
name = "asset-recovery-staging"
project = "apartment-3d"
worktree = true
merge_target = "main"
timeout_min = 45
depends_on = ["land-space-plan-branches"]
verify = "python run_tests.py"
prompt = '''
Read AGENTS.md and docs/DECISIONS.md #96 first. The canonical asset store at C:\Projects\apartment-3d\assets\ was emptied mid-run by a junction-traversing worktree teardown; the restore decision belongs to the human. Your job: preserve every survivor and prepare a one-command restore - WITHOUT writing to C:\Projects\apartment-3d (the shared checkout stays read-only to workers).

Stage into a new directory `C:\Projects\apartment-3d-recovery\` (outside the shared checkout, survives runs):

- Copy the two surviving source videos from %USERPROFILE%\Downloads: 20261013_014405.mp4 (~437 MB) and 20261013_080414.mp4 (~2.3 GB). Record sha256 + size of each.
- Copy the runtime-critical files from the untouched mobile-bundle staging dir C:\Projects\apartment-3d\mobile\app\src\main\assets\assets\: media/{tv-golf,lap-city}.mp4 and textures/crops/*.jpg - record the same hashes.
- Copy the surviving personal-adjacent files from the canonical store read-only: assets/floorplan/* (3 files incl. a2-apt1617.png), assets/avatar/ref-photo.jpg + NOTES.md.
- Write RECOVERY.md there: full inventory with hashes + restore command per item (e.g. `copy <recovery>\videos\*.mp4 C:\Projects\apartment-3d\assets\videos\`), and an explicit PERMANENTLY LOST list - the other source videos, assets/frames/* (regenerable only if footage returns via tools/extract-frames.sh), assets/extras/*, assets/apartment-frames/*.

Then post the decision to the phone queue exactly once:
`python C:\Projects\mobile-apps\pc-bridge\task.py ask --project apartment-3d --title "apartment-3d assets: restore or reshoot?" --body "Run space-plan-core emptied the canonical asset store (DECISIONS #96). Survivors staged at C:\Projects\apartment-3d-recovery\ (2/4 videos, runtime media+crops, floorplan+avatar). RECOVERY.md has the restore commands. Restore survivors + accept 2-video loss, or reshoot the lost footage first?"`

In your own worktree only: update the DECISIONS #96 row's status to "recovery staged at C:\Projects\apartment-3d-recovery\ - human restore pending (phone queue)" and add an .agent_tasks/asset-recovery-staging/STATE.md with the inventory + question id. Run `python run_tests.py` (verify command; no code changed, it just proves the worktree still boots - repopulate the 5 boot-fetched media/crops files as real copies in your worktree first if needed, never junctions into the emptied store).

Finish STATUS: blocked naming the human restore decision - that is the honest terminal state; on_failure=continue lets the run still report it.
'''
