# Observations for the human (not steps):
#   - The 3 unmerged branch worktrees still hold the only copies of the
#      A2 evidence PNGs and (for world-pack/a2) real asset copies; do not
#      clean data/worktrees/20261019-035841-space-plan-core/ until step 2
#      has run.
#   - verify.mjs on main now refuses to probe a port it did not bind only
#      AFTER the a2 merge lands (the fix came in on the world-pack branch).
#   - If the human prefers re-shooting the lost footage over restoring the
