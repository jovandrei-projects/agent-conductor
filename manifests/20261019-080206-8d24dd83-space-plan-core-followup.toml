# run_tests.py OK, node tools/floorplan-import-test.mjs 31/31) - all on
# leased port 8806 after repopulating the 5 boot-fetched files as real
# copies in the review worktree.
#
# Per-deliverable verdict:
#   1. world-pack isolation - CODE DONE + VERIFIED ON BRANCH, NOT MERGED.
#      Branch conductor/.../world-pack: pack-test 40/40, suites 191 checks,
#      verify PASS on 8807. Recorded `failed` solely because the worker
#      printed `STATUS: complete` (invalid token), not done|partial|blocked.
#   2. deterministic image->SceneState importer - DELIVERED + MERGED.
#      31/31 on main, byte-identical docs, pxPerM 40.766 from calibration
#      spans, mirror=x recorded (never baked), [ASSUMED] ceiling/conventions
#      logged (DECISIONS 94-95). Gap: run_tests.py on main predates the
#      node-suite wiring - fixed on the a2 branch.
#   3. A2 closed-loop proof (overlay verifier + reference diff) - CODE +
#      EVIDENCE DONE ON BRANCH, NOT MERGED. overlay-verifier and
#      a2-closed-loop each ended without a STATUS line (turn exhausted mid
#      report) -> recorded failed, branches kept. iter13 gate = overlay
#      PASS 0 fail/14 warn vs source plan; doc-vs-oracle diff = 11
