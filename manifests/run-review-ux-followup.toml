[[step]]
name = "verify-gate-flake-hardening"
project = "agent-conductor"
worktree = true
timeout_min = 75
verify = ""
prompt = '''
Two verify-gate failures inside run 20261016-100852-run-review-ux were flakiness, not real defects - reproduce, root-cause, and harden both so the gate stops false-failing:

1. tests/test_conductor.py ProposalFlowIntegrationTests.test_stop_edit_reprepare_retain_then_launch_runs_step1 failed inside the inspect-and-design gate (verify log tail: AssertionError 'generating' != 'ready' around line 3286, ~458s into the suite, and the same test class was already flagged flaky in the earlier proposal-flow-fixes run). The verify-proposal-flow step already patched the same-second publish race once (_disk_untouched mtime + generation_stopped_at compare) - the residual is likely a drain/ordering edge where the record still reads 'generating'. Reproduce (loop the test, run it under parallel load, or shrink the timing windows), root-cause for real, then fix the underlying race if it is one or convert the test to wait on the actual condition instead of fixed sleeps.

2. manual-merge-guard's in-worktree suite run reported 2 StepControlTests failures where the `_wait_run_dir` helper's 10s deadline expired under full-suite load (both pass standalone). Same treatment: reproduce under load, root-cause, deterministic synchronization or a properly bounded deadline - not a blind sleep bump.

A sibling proposal (manifests/proposal-ui-fixes-followup.toml) covers the `_flag_soon` wall-clock / queued-flag flake family - if either failure here turns out to be that same family, fix the underlying race once rather than layering test patches, and say so in the report.

Acceptance: each touched test passes 20 consecutive runs, `python run_tests.py` is green end-to-end (run it manually - the driving conductor still caps its gate at 600s until verify-timeout-config ships in a later driver), and suite wall time does not grow meaningfully. Update .agent_tasks; commit code separately from bookkeeping.
'''

