[[step]]
name = "review-ux-live-smoke"
project = "agent-conductor"
worktree = true
timeout_min = 60
verify = ""
prompt = '''
The run-review-ux feature set is only mock/node-harness verified - the parent run's integration-verification worker explicitly left "a real-browser pass over the combined dashboard" as the manual-check remainder (the node harness asserts DOM behavior, not painted CSS). Do that pass now against the LANDED master state (land-run-review-ux-branches ran first).

TRAP-5-safe setup (proven pattern): copy the repo to a scratch dir nobody watches - robocopy/xcopy C:\Projects\agent-conductor -> %TEMP%\ac-rrux-smoke-<ts> EXCLUDING .git, data, worktrees and caches; run `python examples/make_demo_projects.py` in the copy so data/demo1 exists; then `python conductor.py serve --port <free 87xx>` FROM THE COPY so every write lands under the copy's data/. First check no run driver is live in the real checkout (data/runs/*/state.json driver_pid liveness) - do not disturb a live run.

Against the scratch serve, exercise the original request end-to-end and report what each item actually did (seed finished/interrupted runs with `python conductor.py demo` or fabricated state.json fixtures as needed):
- Review marks: a freshly completed run row and task rows show the needs-review pill/accent (cyan by design; a FAILED unreviewed task must show red status + pill together - the flag never recolors); "Mark as reviewed" / "Mark as needing review" work from the run modal, the task modal, and both context menus; the ack survives a serve restart; an ack sent against a stale completion_seq is rejected; a simulated re-completion re-flags despite the older ack.
- Task outcome: the task modal shows the outcome row, the agents-table result column leads with it, a pre-contract record shows the honest unavailable state, and STATUS/NEXT-derived fields are untouched.
- Agents table: the step-name button opens the task modal, the run-name applies the run filter, a bare-row click does NOT open a modal, the .dsel selected-row highlight survives refresh and follows prev/next navigation, and closing the modal clears it. Keyboard: Tab focus, Enter/Space opens, ArrowLeft/ArrowRight navigate, Esc closes, Shift+F10 opens the context menu.
- Task modal scroll: while a run's log keeps growing, the 2s repaint preserves scroll position (reuse the modal-refresh-stability probe approach).
- Runs table: the elapsed column ticks for a live run and shows banked+cumulative time on a resumed record; the 'wt' chip appears on a worktree-configured run (incl. the 'wt N/M' mixed form).
- Merge pending branches is disabled WITH its explanation while a run executes (fabricate a live driver_pid the way ManualMergeGuardTests does) and works once the run ends.

Use a real browser engine where available (Playwright/Chromium - past sessions have driven it here); otherwise node-harness + DOM assertions, and state plainly which checks were pixel-verified vs DOM-only. COMMIT the probe script under tests/ or a probes dir this time - past probes lived in scratch/ and were lost (a design-doc gap).

Verify, do not fix: if something is broken live, record it precisely in .agent_tasks and finish `partial` rather than patching in this step. Kill EVERY spawned process (serve, browser drivers) BEFORE printing STATUS - a live child keeps this session from exiting (trap 12). Commit bookkeeping only.
'''

