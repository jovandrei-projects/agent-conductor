[run]
name = "run-review-ux-followup"
description = "Land the five parked run-review-ux branches (review marks, cumulative elapsed time, manual merge guard, design docs - already union-verified on the integration-verification branch), make the 600s verify cap configurable, harden the two gate flakes this run exposed, and do the deferred real-browser pass over the combined dashboard."
on_failure = "continue"
checkpoint = true
merge_resolver = true

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 60
max_attempts = 3
verify = "python run_tests.py"

# Every step below carries verify = "" on purpose: the DRIVING conductor's
# gate is still hard-capped at 600s while this suite already needs ~780s,
# so the registered command would false-fail every step exactly like it did
# three times in the parent run. Each step prompt requires running
# `python run_tests.py` manually to green instead - same gate, uncapped.

# ---------------------------------------------------------------------------
# Step 1 runs in the MAIN checkout on purpose: merging parked branches into
# the checked-out master is checkout-level work (established convention from
# ux-controls-followup). It cannot be worktree-isolated.
[[step]]
name = "land-run-review-ux-branches"
project = "agent-conductor"
timeout_min = 90
verify = ""
prompt = '''
Land the parked worktree branches of run 20261016-100852-run-review-ux onto master in THIS (main) checkout. All feature work on them is complete and was already verified by the workers - your job is the merges, the run-record bookkeeping the merge verb does, and a final combined verification, not re-doing features.

Background: `conductor/20261016-100852-run-review-ux/integration-verification` (tip 31ee57f at draft time) already union-merges the other four parked branches - inspect-and-design 59b3c18, review-workflow 8888cb7, cumulative-elapsed-time 6f1af6f, manual-merge-guard e81d03b (re-confirm with `git merge-base --is-ancestor <branch> conductor/20261016-100852-run-review-ux/integration-verification`) - and carries a combined-state verification: 457/457 tests + demo green in its worktree plus a live serve smoke of the new review endpoints. Merging that ONE branch first lands everything; the per-step branches then reduce to already-up-to-date no-ops.

Preflight - do NOT skip (a sibling run was still live at draft time):
- Confirm the parent run ended: data/runs/20261016-100852-run-review-ux/state.json has no step still `running` and its driver_pid is dead.
- Check every OTHER data/runs/*/state.json: if any has a live driver_pid or a step whose work_dir is inside this repo (run 20261016-013719-workflow-ux-safety was live at draft time), finish `blocked` and name it - a foreign driver's `git add -A` checkpoint can sweep your mid-merge tree into a stray "checkpoint" commit (documented incident), and a same-repo merge lock may already be held.
- Require `git status` clean and the checkout on master before starting.

Then:
1. `git merge --no-edit conductor/20261016-100852-run-review-ux/integration-verification`. Expected conflicts: .agent_tasks/QUEUE.md + .agent_tasks/efficiency_stats.md (both-append bookkeeping - union them: keep every DONE line and stats row from both sides, chronological order, drop only exact-duplicate lines) and possibly conductor.py / tests hunks where master's later commits moved nearby code - resolve semantically, never by dropping a side. Afterwards `git grep -n "^<<<<<<<"` must be empty.
2. `python conductor.py merge data/runs/20261016-100852-run-review-ux` - the supported pending-branch path stamps merged/merged_at + step_merged events and merges the rest in manifest order. The four worker branches are ancestors now; their kept worktrees auto-remove on success. The follow-up-plan branch is the only real remaining merge (bookkeeping + the new manifests/run-review-ux-followup.toml). KNOWN TRAP: if an UNTRACKED copy of that same manifest file sits in this checkout's manifests/ dir (the review workflow drops it there), delete it or verify it byte-identical BEFORE the merge - git refuses to overwrite an untracked same-path file and reports it as a conflict (burned run 20261016-013711-proposal-flow-fixes this way).
3. Verify: `git merge-base --is-ancestor <tip> master` succeeds for all six branches; state.json records show merged=true (the verb also flips their status off `failed`); `git worktree list` shows no 20261016-100852-run-review-ux worktrees left; `python run_tests.py` run to green (the combined suite needs ~780s - normal here; the conductor 600s gate cap is the NEXT step's job); `python conductor.py demo` green.
4. If the merged tree genuinely fails, investigate and fix on master (commit fixes separately from the merge) - do not just rerun. NEVER finish with a merge in progress: each merge ends committed or `git merge --abort`ed.

Update .agent_tasks (most QUEUE.md/efficiency_stats.md ledger entries already ride the merged branches - add only what is missing) and commit bookkeeping separately from fixes.
'''

