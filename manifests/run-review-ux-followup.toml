[[step]]
name = "verify-timeout-config"
project = "agent-conductor"
worktree = true
timeout_min = 75
verify = ""
prompt = '''
The post-step verify gate is hard-capped at 600s and this project outgrew it: in run 20261016-100852-run-review-ux three steps (cumulative-elapsed-time, manual-merge-guard, integration-verification) recorded `failed` with `verify timed out after 600s` in their .verify.log while the suite was green in-worktree (~457 tests, ~783s combined and still growing). Every gate on the registered `python run_tests.py` now false-fails.

Make the verify timeout configurable in conductor.py:
- New optional `verify_timeout_s` key honored per [[step]] and in [defaults] (numeric seconds, a sane floor such as >= 60; invalid values fail manifest validation loudly like max_attempts does). Raise the built-in default to 1200.
- Apply it at BOTH hard-coded sites: the post-step verify in run_step (`timeout=600` near line 3748 - and make the "verify timed out after Ns" log line print the configured N) and the deferred-staging verify (same pattern near line 7979). Grep for any other verify timeout site and cover it too.
- Record the effective value on the step record (e.g. rec["verify_timeout_s"]) so it is inspectable; keep the payload shape stable otherwise.
- Document the key in AGENTS.md where verify gates are described and in the annotated example manifest(s) under examples/ that document verify; also update AGENTS.md if it still claims a stale suite duration.
- Optional, only if it fits existing env-knob conventions (ARCHIVE_AFTER_S / TRASH_RETAIN_S style): a CONDUCTOR_VERIFY_TIMEOUT_S override. Skip rather than bolt on awkwardly.

Tests: manifest parse, validation bounds, default value, both call sites honoring the configured value, the log line text, and unchanged project-verify inheritance. Note this step's own conductor gate is useless (the driving conductor still has the old cap) - run `python run_tests.py` yourself to green; budget ~15min for it. Update .agent_tasks and commit code separately from bookkeeping.
'''

