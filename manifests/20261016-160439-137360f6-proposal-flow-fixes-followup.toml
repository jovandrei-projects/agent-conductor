[run]
name = "proposal-flow-fixes-followup"
description = "Residuals from the proposal-flow-fixes run: complete retained planner-attempt history (per-attempt artifacts + live session id), fix transitively-merged steps staying marked failed/unmerged, and one bounded live smoke of the stop/reprepare/retain/launch flow."
on_failure = "continue"
checkpoint = true
merge_resolver = true

[defaults]
model = "swe-2"
effort = "max"
mode = "bypass"
timeout_min = 60
max_attempts = 3
verify = 'python run_tests.py'

# ---------------------------------------------------------------------------

[[step]]
worktree = true
name = "plan-history-completeness"
project = "agent-conductor"
prompt = '''
Finish the retained proposal-history feature from run 20261016-013711-proposal-flow-fixes (retain-proposal-session STATE.md lists both items under "Deferred or blocked" - they are the only scope here).

Context: each generation attempt currently shares `<request_id>.gen.log` and `<request_id>.gen.export.json` in the planner spool dir (%TEMP%/agent-conductor-planner/<id>/), so a regenerated attempt overwrites the previous one's artifacts - older `plan-proposal-N` history rows render session id + status + times but dead/absent file links. Separately, the in-flight `plan-proposal` row shows '...' as its session id until the attempt ends because the `devin list` capture runs only after `_planner_response` returns.

Two changes:

1. Per-attempt artifacts: name spool outputs per attempt (e.g. `gen-<gen_id>.log` / `gen-<gen_id>.export.json` or an attempt index - pick whatever fits the existing spool naming) and wire `plan_attempt_agents`/`_plan_attempt_entry` so EVERY retained history row links its own log/export/tail/arc files, not just the newest. Keep `<id>.gen.*` compatibility for in-flight readers if anything still reads the generic names (check gen_last/genline + drain paths), and make `drain_planner_spool`/`_publish_from_spool` preserve the per-attempt mapping. Do not break the live-output tailing the dashboard reads during generation.

2. Live session-id attribution while `generating`: reuse the existing `_capture_session_id` pattern (the `devin list` diff probe already used for run steps - it is read-only and trap-5-safe inside the planner tempdir) so the running plan-proposal row can show the real session id once the planner session registers, instead of '...' until attempt end. The post-wait fallbacks (export session_id/session + tail_session_ref) stay as the authoritative final value - reconcile rather than double-record if they disagree.

Tests: extend the existing RetainProposalSessionTests/StopProposalTests style - assert a stopped-then-regenerated request yields two history rows EACH with working file paths, and the generating-state row carries a session id once the probe sees it. `python run_tests.py` must stay green (233+ expected). Update .agent_tasks (tick the deferred items in retain-proposal-session/STATE.md) and commit in logical groups.
'''

# ---------------------------------------------------------------------------

[[step]]
worktree = true
name = "merged-record-accuracy"
project = "agent-conductor"
timeout_min = 45
prompt = '''
Fix a run-record truthfulness bug this run exposed, then do its housekeeping.

Bug: in run 20261016-013711-proposal-flow-fixes, steps retain-proposal-session and fix-compact-labels recorded `status="failed"` + `merged=false` when their merge gates failed - but their work IS on master today, because the later verify-proposal-flow step merged both branches into its own worktree branch (1c1f1d5, c3e19b4) and the conductor then merged that branch (00722cc). The post-wave merge loop in conductor.py (~line 2370: `if worktree_merge(...): rec["merged"] = True`) only ever marks the branch it merges directly, so transitively-landed work stays marked failed/unmerged forever - and `merged is not True` is also what feeds the "Merge pending branches" affordance, so these branches are wrongly offered as pending.

Change: after ANY successful merge of a run's branch (post-wave loop, `merge_run`, and the `--resume` finalize path - find every place `merged` is set), sweep the SAME run's other step records: for each step with a recorded `branch` and `merged is not True`, check `git merge-base --is-ancestor <branch> HEAD` in the target repo; if the branch tip is reachable, set `merged=True` and append a note like "branch content reached master transitively via <merge commit/sibling step>". Do NOT rewrite `status` (a step that verify-failed stays failed - the record was honest at the time; only the merge flag is corrected). Regression-test it in the existing mock style: a fake two-branch run where branch B merges branch A's commits into itself, then the run merges B - A's record must end `merged=True` without being offered as pending.

Then housekeeping for the parent run's debris - all in the shared repo, safe from inside your own worktree: `git merge-base --is-ancestor conductor/20261016-013711-proposal-flow-fixes/retain-proposal-session master` and the same for .../fix-compact-labels; if (and only if) both are ancestors, `git worktree remove --force data/worktrees/20261016-013711-proposal-flow-fixes/retain-proposal-session` + `.../fix-compact-labels` and `git branch -d` both branches. If ancestry fails, stop, report which branch is not merged, and do NOT force-remove anything. NEVER touch the 20261016-013719-workflow-ux-safety worktrees/branches (a different, live run) or your own follow-up-plan worktree.

`python run_tests.py` green at the end. Update .agent_tasks and commit the code change separately from bookkeeping.
'''

# ---------------------------------------------------------------------------

[[step]]
worktree = true
name = "proposal-flow-live-smoke"
project = "agent-conductor"
verify = ""
prompt = '''
Live-smoke the three proposal-flow fixes from run 20261016-013711-proposal-flow-fixes - they are only mock/Playwright-stub verified; no real Devin planner has ever been through the sequence. Verify, don't fix: if something is broken live, record it precisely in .agent_tasks and finish partial rather than patching in this step.

TRAP-5 WARNING that shapes the setup: `DATA_DIR`/`RUNS_DIR`/`REQUESTS_DIR` are anchored to `Path(conductor.py).parent`, so `python conductor.py serve` writes under `<script dir>/data/` regardless of cwd. Writes inside a watched cwd can kill a live Devin session's edit-awareness (trap 5) - and YOUR OWN worktree is watched by your own session, while the main checkout may be watched by a sibling run's resolve/merge session (check `git worktree list` + other runs' state.json for live drivers first). SAFE SETUP: copy the repo to a scratch dir nobody watches, e.g. `robocopy /MIR` (or xcopy) C:\Projects\agent-conductor -> %TEMP%\ac-smoke-<ts> EXCLUDING .git, data, worktrees and node caches; run `python examples/make_demo_projects.py` there so data/demo1 exists as a seed repo; then `python conductor.py serve --port <free 87xx>` FROM THE COPY. All request/run writes then land under the copy's data/ - nothing watched. (Fallback if the copy approach fails: serve from this worktree exactly like verify-proposal-flow did - it survived - but expect the risk.)

Against the scratch serve:

1. POST /api/requests a trivial request for project demo1 (e.g. "add a one-line readme note"), POST .../generate - a REAL planner session spawns.
2. Mid-generation: GET /api/state - the plan-proposal row appears with live gen_last; in a headless browser if available, confirm the compact row shows the planning chip + genline + labels (Playwright has been used by past sessions here).
3. POST /api/requests/<id>/stop - the REAL planner proc dies, stage restores draft (or ready if a prior proposal existed), inputs still editable. This stop of a live planner is the single most valuable observation - report exactly what happened.
4. Edit raw, POST .../generate again, let it publish to ready: the plan-proposal row keeps its real session id after the attempt ends AND after a serve restart (reload persistence). The stopped attempt shows as its own plan-proposal-N stopped row.
5. Launch the published plan (the request-run endpoint the Start run button uses). The nested run executes the manifest's real step 1 inside data/demo1 - watch its state.json: exactly the manifest steps appear, NO plan-proposal step, no planner respawn. Once step 1 is visibly running (or done), Stop the run via the run-stop endpoint so it doesn't burn a full session; a trivial prompt should finish fast either way.
6. Compact+full density check on the runs table (browser or DOM inspection): run-row chips + planner:/steps: labels stay visible - the merged .rlabels/.toksub markup.

Cleanup: stop the launched run, discard the throwaway request, delete the generated manifest inside the copy, then kill the serve process and the %TEMP% copy. Kill EVERY spawned process BEFORE printing STATUS - a live child keeps this session from exiting (trap 12). If devin auth is missing or the planner stalls >15 min, finish `partial` with exactly what was observed. Update .agent_tasks; commit bookkeeping only - no code changes belong in this step.
'''

