# Example overnight manifest. Copy to <project>/night.toml (or anywhere) and
# edit. Run with:  python conductor.py plan night.toml   then   run.
#
# Semantics:
#  - steps run in file order, each in a FRESH `devin -p` session
#  - on_failure = "stop" halts the run on failed/timed_out/blocked steps
#    ("continue" keeps going; partial/done never stop the run; a
#    dashboard 'Stop this step' vetoes one task but the run proceeds -
#    only run-level Pause/Stop halt it)
#  - checkpoint = true: conductor commits the project before AND after each
#    step, so every worker starts from a clean committed state and any
#    damage is one `git revert/reset` away
#  - [defaults] keys apply to every step that doesn't override them
#
# Good prompt style: point at .agent_tasks rather than pasting the task -
# "pick up the next task in QUEUE.md" stays correct even if a planner step
# earlier in the same manifest reorders the queue.

[run]
name = "video-tools-night"
on_failure = "stop"
checkpoint = true
# max_hours = 8      # wall-clock cap for the whole run (optional)
# max_parallel = 2   # concurrent-agent cap. Default is conservative
                     # (about 1 per 4 logical cores, max 4). Each agent is a
                     # full Devin session - don't set 100 on a desktop.
# merge_resolver = true  # on a worktree merge conflict, spawn a
                     # "resolve-<step>" session in the main checkout to
                     # finish the merge (mid-merge) instead of only parking
                     # the worktree for a human. Also settable per step.
                     # Refused on a dirty main checkout. Default: off.
# merge = "deferred"     # default "auto": worktree branches merge back
                     # after each step. "deferred" instead RETAINS every
                     # branch, worktree, commit and verify result as a
                     # pending merge (state.json -> pending_merges) until a
                     # human runs `conductor.py merge <run_dir>` or clicks
                     # Merge pending branches. Sequential steps then branch
                     # off a per-run integration baseline branch so each
                     # still sees its verified predecessors; same-wave
                     # same-project steps stay separate alternatives. The
                     # explicit merge stages+re-verifies the combination in
                     # an isolated worktree before the target moves - a
                     # failed verify there lands nothing.

[defaults]
model = "swe"          # cheap model for grind phases; use "opus"/"gpt" for planning
# effort = "min"       # thinking-effort variant; fuses onto the model id
                       # (model+effort -> "swe-min" style). Unknown variant
                       # fails loudly at spawn. Column on the dashboard.
mode = "bypass"        # unattended: no human to answer prompts
timeout_min = 60
# max_attempts = 3     # a step hitting timeout_min is committed as-is, then
                       # retried in a FRESH session (a "continue from committed
                       # state" note is prepended to its prompt) up to this
                       # many attempts total - an underestimated timeout keeps
                       # going instead of ending the step. Default: 1.

[[step]]
name = "next-queue-task"
project = "video-tools"
prompt = "Pick up the next task in .agent_tasks/QUEUE.md and work it to done or blocked. One task only."

[[step]]
name = "test-sweep"
project = "video-tools"
prompt = "Run python run_tests.py, fix any failures, then update ROADMAP.md statuses that the green suite proves out."
verify = "python run_tests.py --quick"
timeout_min = 90

# A planner step: a stronger model re-slices the queue mid-run. Because worker
# prompts point at QUEUE.md, steps after this one pick up the new plan.
[[step]]
name = "replan"
project = "video-tools"
model = "opus"
prompt = "You are the planner. Read ROADMAP.md and every STATE.md not done. Re-order QUEUE.md for the next sessions: split anything too big for one session, drop anything stale. Do not implement anything."

[[step]]
name = "next-queue-task-2"
project = "video-tools"
prompt = "Pick up the next task in .agent_tasks/QUEUE.md and work it to done or blocked. One task only."

