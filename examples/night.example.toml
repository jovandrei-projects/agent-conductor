# Parallel wave: adjacent steps sharing a `wave` number run concurrently.
# Steps on the SAME project must set worktree=true - each runs in a git
# worktree on branch conductor/<run>/<step>, merged back after the wave in
# manifest order. Merges are always conductor-owned: workers never merge;
# the parent waits for the whole wave, then merges each branch itself in
# manifest order. Merge conflict -> step fails, worktree kept under
# data/worktrees/ for manual merge - or, with merge_resolver=true, a
# resolve-<step> session finishes it. Different projects parallelize
# freely (no worktree needed on different dirs).
#
# [[step]]
# name = "ui-polish"
# project = "project-hub"
# wave = 1
# worktree = true
# prompt = "..."
#
# [[step]]
# name = "api-polish"
# project = "project-hub"
# wave = 1
# worktree = true
# prompt = "..."
#
# [[step]]
# name = "unrelated-other-project"
# project = "thermalwatch"
# wave = 1            # runs in the same wave, in the project dir itself
# prompt = "..."
